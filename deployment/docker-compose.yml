version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lifemanager_postgres
    environment:
      POSTGRES_DB: lifemanager
      POSTGRES_USER: lifemanager
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lifemanager_network

  redis:
    image: redis:7-alpine
    container_name: lifemanager_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - lifemanager_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lifemanager_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql://lifemanager:password@postgres:5432/lifemanager
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - SECRET_KEY=your-secret-key-change-in-production
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - lifemanager_network

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lifemanager_worker
    command: celery -A worker worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://lifemanager:password@postgres:5432/lifemanager
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-in-production
    volumes:
      - ../backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - lifemanager_network

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lifemanager_beat
    command: celery -A worker beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://lifemanager:password@postgres:5432/lifemanager
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-in-production
    volumes:
      - ../backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - lifemanager_network

networks:
  lifemanager_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
