<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - LifeManager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .phone-frame {
            width: 375px;
            height: 812px;
            background: #f5f5f5;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .app-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .app-slogan {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            flex: 1;
            padding: 30px 25px;
            overflow-y: auto;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .form-input:focus {
            border-color: #667eea;
        }
        
        .form-input::placeholder {
            color: #ccc;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }
        
        .remember-me input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        .forgot-password {
            font-size: 13px;
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #999;
            font-size: 13px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        
        .divider span {
            padding: 0 15px;
        }
        
        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .social-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        
        .register-link {
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        
        .guest-login {
            text-align: center;
            margin-top: 20px;
        }
        
        .guest-btn {
            padding: 12px 30px;
            background: transparent;
            color: #999;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .guest-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .feature-item {
            text-align: center;
        }
        
        .feature-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .feature-text {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 📡 🔋</span>
        </div>
        
        <div class="header">
            <div class="logo">🎯</div>
            <div class="app-name">LifeManager</div>
            <div class="app-slogan">智能生活管理助手</div>
        </div>
        
        <div class="content">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">手机号 / 邮箱</label>
                    <input type="text" class="form-input" id="username" placeholder="请输入手机号或邮箱">
                </div>
                
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="password" placeholder="请输入密码">
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>记住我</span>
                    </label>
                    <a class="forgot-password" onclick="forgotPassword()">忘记密码？</a>
                </div>
                
                <button type="submit" class="submit-btn">登录</button>
                
                <div class="divider">
                    <span>其他登录方式</span>
                </div>
                
                <div class="social-login">
                    <button type="button" class="social-btn" onclick="wechatLogin()">💬</button>
                    <button type="button" class="social-btn" onclick="qqLogin()">🐧</button>
                    <button type="button" class="social-btn" onclick="githubLogin()">🐱</button>
                </div>
                
                <div class="register-link">
                    还没有账号？<a onclick="goToRegister()">立即注册</a>
                </div>
                
                <div class="guest-login">
                    <button type="button" class="guest-btn" onclick="guestLogin()">游客登录</button>
                </div>
            </form>
            
            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon">📋</div>
                    <div class="feature-text">任务管理</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📊</div>
                    <div class="feature-text">统计分析</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🤖</div>
                    <div class="feature-text">AI助手</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username) {
                alert('请输入手机号或邮箱');
                return;
            }
            
            if (!password) {
                alert('请输入密码');
                return;
            }
            
            // 模拟登录请求
            alert('登录成功！\n用户名: ' + username);

            // 跳转到AI助手页面
            window.location.href = 'ai-assistant-enhanced.html';
        }
        
        function goToRegister() {
            window.location.href = 'register.html';
        }
        
        function forgotPassword() {
            alert('跳转到忘记密码页面');
        }
        
        function wechatLogin() {
            alert('微信登录功能开发中...');
        }
        
        function qqLogin() {
            alert('QQ登录功能开发中...');
        }
        
        function githubLogin() {
            alert('GitHub登录功能开发中...');
        }
        
        function guestLogin() {
            alert('游客登录\n\n注意：游客模式下数据仅保存在本地，更换设备后无法恢复。\n\n是否继续？');
            // 跳转到AI助手页面
            window.location.href = 'ai-assistant-enhanced.html';
        }
    </script>
</body>
</html>
